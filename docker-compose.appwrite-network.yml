# Connect the API to the network used by Appwrite's Sites/Functions runtimes.
# The existing Appwrite stack is not part of this Compose project.
services:
  backend-api:
    networks:
      default: {}
      appwrite-runtime:
        aliases:
          - call-grader-api

networks:
  appwrite-runtime:
    external: true
    name: ${APPWRITE_RUNTIME_NETWORK:?Set the existing Appwrite runtime network}
