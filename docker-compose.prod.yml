services:
  backend-api:
    image: yousuf-rice-backend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file: ["${CALL_GRADER_ENV_FILE:-.env}"]
    environment:
      SERVICE_ROLE: api
      APP_ENV: production
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - playwright-state:/tmp/yousuf-playwright-state
      - worker-tmp:/tmp/yousuf-audio
    restart: always

  backend-worker:
    image: yousuf-rice-worker:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file: ["${CALL_GRADER_ENV_FILE:-.env}"]
    environment:
      SERVICE_ROLE: worker
      APP_ENV: production
    volumes:
      - playwright-state:/tmp/yousuf-playwright-state
      - worker-tmp:/tmp/yousuf-audio
    shm_size: 1gb
    restart: always
    depends_on:
      - backend-api

  backend-scheduler:
    image: yousuf-rice-worker:${APP_VERSION:-latest}
    env_file: ["${CALL_GRADER_ENV_FILE:-.env}"]
    environment:
      SERVICE_ROLE: scheduler
      APP_ENV: production
    volumes:
      - playwright-state:/tmp/yousuf-playwright-state
    restart: always
    depends_on:
      - backend-worker

  web:
    profiles: [local-preview]
    image: yousuf-rice-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_APPWRITE_ENDPOINT: ${NEXT_PUBLIC_APPWRITE_ENDPOINT}
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${NEXT_PUBLIC_APPWRITE_PROJECT_ID}
    env_file: ["${CALL_GRADER_ENV_FILE:-.env}"]
    environment:
      APP_ENV: production
      BACKEND_INTERNAL_URL: http://backend-api:8000
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    depends_on:
      - backend-api

volumes:
  playwright-state:
  worker-tmp:
