services:
  backend-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file: [.env]
    environment:
      SERVICE_ROLE: api
      APPWRITE_ENDPOINT: http://host.docker.internal/v1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - playwright-state:/tmp/yousuf-playwright-state
      - worker-tmp:/tmp/yousuf-audio
    restart: unless-stopped

  backend-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file: [.env]
    environment:
      SERVICE_ROLE: worker
      APPWRITE_ENDPOINT: http://host.docker.internal/v1
    volumes:
      - playwright-state:/tmp/yousuf-playwright-state
      - worker-tmp:/tmp/yousuf-audio
    shm_size: 1gb
    restart: unless-stopped
    depends_on:
      - backend-api

  backend-scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    env_file: [.env]
    environment:
      SERVICE_ROLE: scheduler
      APPWRITE_ENDPOINT: http://host.docker.internal/v1
    volumes:
      - playwright-state:/tmp/yousuf-playwright-state
    restart: unless-stopped
    depends_on:
      - backend-worker

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_APPWRITE_ENDPOINT: ${NEXT_PUBLIC_APPWRITE_ENDPOINT}
        NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${NEXT_PUBLIC_APPWRITE_PROJECT_ID}
    env_file: [.env]
    environment:
      BACKEND_INTERNAL_URL: http://backend-api:8000
      APPWRITE_ENDPOINT: http://host.docker.internal/v1
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      - backend-api

volumes:
  playwright-state:
  worker-tmp:
